name: MonadLive 24h Brand Collector

on:
  workflow_dispatch:         # 깃허브 웹에서 수동 즉시 실행 버튼 제공

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: pip install requests beautifulsoup4 urllib3

      - name: 클라우드 브랜드 수집 실행
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          WEBHOOK_SECRET: monad_auto_2026
        run: python -u github_collect.py

      - name: 수집 이력 저장 (중복 방지)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add collected_history.txt collector_state.json || true
          git diff --staged --quiet || git commit -m "chore: update collected brand history"
          git push
