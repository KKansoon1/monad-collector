name: MonadLive 24h Brand Collector

on:
  schedule:
    - cron: '*/30 * * * *'   # 30분마다 클라우드에서 자동 실행
  workflow_dispatch:         # 깃허브 웹에서 수동 즉시 실행 버튼 제공

permissions:
  contents: write

# 중복 실행으로 인한 git push 충돌 및 시트 중복 적재 방지
concurrency:
  group: monad-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: pip install requests beautifulsoup4 urllib3

      - name: 클라우드 브랜드 수집 실행
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          WEBHOOK_SECRET: monad_auto_2026
        run: python -u github_collect.py

      - name: 수집 이력 저장 (충돌 자동 해결 포함)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add collected_history.txt collector_state.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update collected brand history"
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort || true
              git fetch origin main
              python3 - <<'EOF'
          import json, subprocess

          def git_show(ref_path):
              try:
                  return subprocess.check_output(["git", "show", ref_path], text=True)
              except subprocess.CalledProcessError:
                  return None

          local_s = git_show("HEAD:collector_state.json")
          remote_s = git_show("origin/main:collector_state.json")
          if local_s or remote_s:
              l = json.loads(local_s) if local_s else {}
              r = json.loads(remote_s) if remote_s else {}
              merged = {
                  **r,
                  **l,
                  "used_queries": list(dict.fromkeys(r.get("used_queries", []) + l.get("used_queries", []))),
                  "last_newswire_no": max(r.get("last_newswire_no", 0), l.get("last_newswire_no", 0)),
              }
              with open("/tmp/collector_state.json", "w", encoding="utf-8") as f:
                  json.dump(merged, f, ensure_ascii=False, indent=2)

          local_h = git_show("HEAD:collected_history.txt")
          remote_h = git_show("origin/main:collected_history.txt")
          if local_h is not None or remote_h is not None:
              lines = list(dict.fromkeys((remote_h or "").splitlines() + (local_h or "").splitlines()))
              with open("/tmp/collected_history.txt", "w", encoding="utf-8") as f:
                  f.write("\n".join(lines) + ("\n" if lines else ""))
          EOF
              git reset --hard origin/main
              [ -f /tmp/collector_state.json ] && mv /tmp/collector_state.json collector_state.json
              [ -f /tmp/collected_history.txt ] && mv /tmp/collected_history.txt collected_history.txt
              git add collected_history.txt collector_state.json 2>/dev/null || true
              if ! git diff --staged --quiet; then
                git commit -m "chore: update collected brand history"
              fi
            fi
            git push origin main
          fi
